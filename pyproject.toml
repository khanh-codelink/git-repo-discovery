[project]
name = "git-repo-discovery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "khanh-codelink", email = "khanh.nguyen@codelink.io" }
]
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.26.0",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "langchain-azure-ai>=1.2.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "ollama>=0.6.0",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "uvicorn>=0.35.0",
]

[tool.vercel]
entrypoint = "src.git_repo_discovery.api.index:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF100",
    "PLR0912",
    "C901",
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
    "B905",  # zip without strict
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
