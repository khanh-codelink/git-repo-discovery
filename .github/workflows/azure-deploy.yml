name: Build and deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Container App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      IMAGE_NAME: git-repo-discovery
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_CONTAINER_APP_NAME; do
            if [[ -z "${!variable}" ]]; then
              printf '::error::Missing GitHub production variable: %s\n' "$variable"
              exit 1
            fi
          done

      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resources and sign in to ACR
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" --output none
          registry_server="$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_ACR_NAME" --query loginServer --output tsv)"
          printf 'server=%s\n' "$registry_server" >> "$GITHUB_OUTPUT"
          az acr login --name "$AZURE_ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.registry.outputs.server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image digest
        shell: bash
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.server }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --image "${REGISTRY_SERVER}/${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --output none

      - name: Check API health
        shell: bash
        run: |
          set -euo pipefail
          app_host="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          if [[ -z "$app_host" ]]; then
            printf '::error::The Container App must have external HTTP ingress.\n'
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 10 \
            --connect-timeout 10 --max-time 30 "https://${app_host}/"
          printf '\nDeployed API: https://%s\n' "$app_host"
          printf '### Azure deployment\n\nAPI: https://%s\n\nImage: `%s/%s@%s`\n' \
            "$app_host" "$REGISTRY_SERVER" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY_SERVER: ${{ steps.registry.outputs.server }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}

      - name: Sign out of Azure
        if: always()
        run: az logout