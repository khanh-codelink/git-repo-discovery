name: Trigger auto deployment for git-discover-be

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/git-discover-be-AutoDeployTrigger-0958f310-e047-4224-b4c9-357bc7b4abac.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GITDISCOVERBE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GITDISCOVERBE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GITDISCOVERBE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: gitdiscover.azurecr.io
          registryUsername: ${{ secrets.GITDISCOVERBE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GITDISCOVERBE_REGISTRY_PASSWORD }}
          containerAppName: git-discover-be
          resourceGroup: group1
          imageToBuild: gitdiscover.azurecr.io/git-discover-be:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


